<!-- BRUSH_FONT_STYLE -->
<div id="shadow-theatre-preview">
  <div class="shadow-app" data-page="home" data-menu-open="false" aria-label="皮影戏台">
    <canvas class="shadow-embers" id="shadow-embers" aria-hidden="true"></canvas>
    <main class="shadow-home" data-screen="home">
      <div class="shadow-book-corners" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="shadow-binding" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <section class="shadow-hero">
        <div class="shadow-hero-copy"><div class="shadow-cover-kicker">一卷传承 · 三种入戏</div><h1>翻开旧事<br>光影<span>入戏</span></h1><p class="shadow-cover-poem">旧纸藏风骨，灯火照乾坤。<br>翻开这一卷，赴一场皮影之约。</p><span class="shadow-cover-seal">光影<br>传书</span></div>
        <div class="shadow-hero-scene"><canvas class="shadow-art" data-art="home" role="img" aria-label="武松打虎皮影画面"></canvas><div class="shadow-scene-cap"><span>光影旧事 · 英雄登场</span><span>《武松打虎》</span></div><div class="shadow-hero-art-title"><span>景阳冈</span><small>一腔豪气 · 一段传奇</small></div></div>
      </section>
      <div class="shadow-menu-reveal" aria-hidden="true" inert>
        <nav class="shadow-mode-list" aria-label="选择模式">
          <button type="button" class="shadow-mode-card cursor-interaction" data-page="classic"><span class="shadow-card-index">壹</span><span class="shadow-card-copy"><span class="shadow-card-volume">第一卷 · 赏经典</span><strong>经典表演</strong><small>重现经典《武松打虎》</small></span></button>
          <button type="button" class="shadow-mode-card cursor-interaction" data-page="touch"><span class="shadow-card-index">贰</span><span class="shadow-card-copy"><span class="shadow-card-volume">第二卷 · 绘新影</span><strong>笔墨成戏</strong><small>画出动作，皮影随心</small></span></button>
          <button type="button" class="shadow-mode-card cursor-interaction" data-page="body"><span class="shadow-card-index">叁</span><span class="shadow-card-copy"><span class="shadow-card-volume">第三卷 · 化身法</span><strong>以身入戏</strong><small>识别人体姿态，动作映入戏台</small></span></button>
        </nav>
      </div>
      <button type="button" class="shadow-home-trigger cursor-interaction" data-action="open-menu" aria-label="轻触屏幕，展开三个模式入口"><span>轻触入戏</span></button>
    </main>

    <main class="shadow-mode-screen shadow-classic-screen" data-screen="classic" hidden>
      <canvas class="shadow-mode-edge" aria-hidden="true"></canvas>
      <div class="shadow-mode-heading"><h2>武松打虎</h2><button type="button" class="shadow-back cursor-interaction" data-page="home"><i data-lucide="arrow-left" aria-hidden="true"></i>返回主界面</button></div>
      <div class="shadow-workspace shadow-classic-workspace">
        <div class="shadow-classic-performance">
          <div class="shadow-stage"><div class="shadow-stage-screen"><canvas class="shadow-art" data-art="classic" role="img" aria-label="武松打虎演出示意"></canvas></div></div>
          <div class="shadow-classic-controls"><div class="shadow-play-controls"><button type="button" class="shadow-primary cursor-interaction" data-action="play" aria-pressed="false"><i data-lucide="play" aria-hidden="true"></i><span>开始表演</span></button><button type="button" class="shadow-secondary cursor-interaction" data-action="replay">重演</button></div></div>
        </div>
        <aside class="shadow-classic-sidebar" aria-label="演出进度与章节">
          <div class="shadow-timeline"><label for="shadow-progress"><span data-classic-caption>第一幕 · 景阳冈</span><output id="shadow-progress-value" for="shadow-progress">0%</output></label><input id="shadow-progress" type="range" min="0" max="100" value="0" aria-label="演出进度"><nav class="shadow-chapters" aria-label="演出章节"><button type="button" data-chapter="0" class="cursor-interaction" aria-pressed="true">景阳冈</button><button type="button" data-chapter="1" class="cursor-interaction" aria-pressed="false">猛虎现身</button><button type="button" data-chapter="2" class="cursor-interaction" aria-pressed="false">赤手搏虎</button><button type="button" data-chapter="3" class="cursor-interaction" aria-pressed="false">英雄落幕</button></nav></div>
        </aside>
      </div>
    </main>

    <main class="shadow-mode-screen" data-screen="touch" hidden>
      <canvas class="shadow-mode-edge" aria-hidden="true"></canvas>
      <div class="shadow-mode-heading"><h2>笔墨成戏</h2><button type="button" class="shadow-back cursor-interaction" data-page="home"><i data-lucide="arrow-left" aria-hidden="true"></i>返回主界面</button></div>
      <div class="shadow-workspace shadow-interactive-workspace">
        <div class="shadow-touch-performance">
          <div class="shadow-stage" data-stage-controller><div class="shadow-stage-screen"><canvas class="shadow-art shadow-touch-stage" data-art="touch" role="img" aria-label="点选武松或老虎，左右拖动角色"></canvas></div><span class="shadow-stage-hint">点选角色 · 左右拖动</span></div>
          <div class="shadow-actor-position-rail"><label for="shadow-actor-position"><span data-position-label>丝杆位置</span><output for="shadow-actor-position" data-position-value>50%</output></label><input type="range" id="shadow-actor-position" min="0" max="100" step="1" value="50" aria-label="所选角色丝杆位置" disabled></div>
          <section class="shadow-sequence" aria-label="已存动作序列">
            <div class="shadow-sequence-toolbar"><span data-sequence-count>动作序列 · 0</span><button type="button" class="shadow-secondary cursor-interaction" data-action="play-sequence" disabled>顺序播放</button><button type="button" class="shadow-secondary cursor-interaction" data-action="delete-frame" disabled>删除</button></div>
            <div class="shadow-sequence-frames" role="group" aria-label="依次存入的画面"><span data-sequence-empty>画好后存入动作，即可依次播放</span></div>
          </section>
        </div>
        <aside class="shadow-controller" aria-label="绘画武松动作">
          <strong class="shadow-controller-title shadow-sr-only" data-drawing-title>先选择角色</strong>
          <div class="shadow-actor-picker shadow-actor-choices" role="group" aria-label="选择操控角色"><button type="button" class="shadow-secondary cursor-interaction" data-touch-actor="wusong" aria-pressed="false">武松</button><button type="button" class="shadow-secondary cursor-interaction" data-action="toggle-training" aria-pressed="false" aria-label="采集真实手绘训练样本" hidden>采集</button><a class="shadow-secondary cursor-interaction" data-batch-entry href="http://127.0.0.1:8780/" target="_blank" rel="noopener noreferrer" aria-label="打开连续采集，不逐张发消息">采集</a></div>
          <div class="shadow-stick-wrap shadow-drawing-wrap"><canvas id="shadow-touch-stick" role="img" aria-label="画出武松动作，再点击识别" aria-disabled="true"></canvas></div>
          <div class="shadow-live-hint" data-touch-caption aria-live="polite">画出武松动作，再点击识别</div>
          <div class="shadow-drawing-actions"><button type="button" class="shadow-primary cursor-interaction" data-action="recognize-drawing" disabled>识别动作</button><button type="button" class="shadow-secondary cursor-interaction" data-action="save-frame">存入动作</button><button type="button" class="shadow-secondary cursor-interaction" data-action="clear-drawing" disabled>重画</button></div>
        </aside>
      </div>
    </main>

    <main class="shadow-mode-screen" data-screen="body" hidden>
      <canvas class="shadow-mode-edge" aria-hidden="true"></canvas>
      <div class="shadow-mode-heading"><h2>以身入戏</h2><button type="button" class="shadow-back cursor-interaction" data-page="home"><i data-lucide="arrow-left" aria-hidden="true"></i>返回主界面</button></div>
      <div class="shadow-workspace shadow-interactive-workspace">
        <section class="shadow-controller shadow-body-controller" aria-label="摄像头识别画面">
          <div class="shadow-stick-wrap shadow-camera-view" data-camera-state="off"><video id="shadow-camera-video" autoplay muted playsinline hidden aria-label="实时摄像头画面"></video><canvas id="shadow-body-stick" role="img" aria-label="实际识别结果的关键点覆盖层"></canvas><div class="shadow-camera-empty" data-camera-empty><i data-lucide="camera" aria-hidden="true"></i><span data-camera-message>摄像头未开启</span></div></div>
          <div class="shadow-camera-controls"><div><div class="shadow-live-hint" data-body-hint>开启摄像头后显示实时画面</div><div class="shadow-body-status" aria-live="polite"><span data-body-status>摄像头未开启</span></div></div><button type="button" class="shadow-primary cursor-interaction shadow-body-start" data-action="toggle-camera" aria-pressed="false">开启摄像头</button></div>
        </section>
      </div>
      <span class="shadow-sr-only" data-body-caption>请站到镜头前，露出完整上半身</span>
    </main>

    <div class="shadow-sample-copy" role="dialog" aria-modal="true" aria-label="复制手绘样本" hidden><label for="shadow-sample-text">复制后粘贴到对话里</label><textarea id="shadow-sample-text" readonly spellcheck="false" aria-label="带题目标注的手绘样本"></textarea><span data-sample-copy-status aria-live="polite"></span><div><button type="button" class="shadow-primary cursor-interaction" data-action="copy-sample">复制样本</button><button type="button" class="shadow-secondary cursor-interaction" data-action="close-sample-copy">返回</button></div></div>
    <div class="shadow-book-transition" id="shadow-book-transition" aria-hidden="true" hidden><canvas class="shadow-page-turn-canvas" id="shadow-page-turn"></canvas></div>
    <div class="shadow-sr-only" aria-live="polite" id="shadow-announcement"></div>
  </div>
</div>

<style>

#shadow-theatre-preview .shadow-home{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 44px;row-gap:28px;padding:24px 28px 24px 42px;margin:0 12px 12px 0;border:2px solid #76532d;border-radius:4px 9px 6px 4px;background:radial-gradient(ellipse at 85% 2%,#99633326,transparent 55%),radial-gradient(ellipse at 2% 98%,#0a0807c9,transparent 50%),repeating-linear-gradient(2deg,#6c4d2b0d 0,#3e2d1d16 1px,#39291c11 3px),linear-gradient(110deg,#3d2b1d,#302217 40%,#3b2a1b 85%,#2b1d13);box-shadow:inset 0 0 0 4px #2c1c11,inset 0 0 0 5px #8c6b3d70,inset 15px 0 25px #090706cc,2px 3px 0 #d6bc8c,4px 5px 0 #755535,5px 8px 0 #b29768,7px 10px 0 #48331d,8px 12px 0 #ae9160;transition:grid-template-rows 480ms cubic-bezier(.22,.72,.26,1),row-gap 480ms cubic-bezier(.22,.72,.26,1)}
