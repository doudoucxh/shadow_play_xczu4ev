  function node(name,attributes,text) {
    const el=document.createElementNS(namespace,name);
    for(const [key,value] of Object.entries(attributes))el.setAttribute(key,String(value));
    if(text!==undefined)el.textContent=text;
    svg.appendChild(el);return el;
  }
  function selected() {
    return plan.phases.find(c=>time>=c.start_s&&time<c.end_s)||plan.phases[plan.phases.length-1];
  }
  function draw() {
    const width=Math.round(chart.getBoundingClientRect().width||root.clientWidth||736);
    const left=108,right=width-9,scale=t=>left+t/plan.duration_s*(right-left);
    const cue=selected();svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${width} 300`);
    node('title',{},'暂不换位的五杆动作时间轴');
    node('desc',{},'横轴为音频秒数。五行分别对应两只手、头身、虎头和虎后部。所有动作尚待本剧本实机验收。');
    const ticks=width<440?[0,42,plan.duration_s]:[0,14,28,42,56,70,plan.duration_s];
    for(const tick of ticks) {
      const x=scale(tick);
      node('line',{x1:x,y1:35,x2:x,y2:264,stroke:'var(--border)','stroke-width':1});
      node('text',{x,y:283,fill:'var(--muted-foreground)','text-anchor':tick===0?'start':tick===plan.duration_s?'end':'middle'},tick===plan.duration_s?'85.33':String(tick));
    }
    for(let i=0;i<plan.roles.length;i++) {
      const role=plan.roles[i],y=48+i*42;
      node('text',{x:0,y:y+18,fill:'var(--foreground)'},labels[i]);
      for(const phase of plan.phases) {
        const active=phase.active_rods.includes(role.id),current=phase.id===cue.id;
        node('rect',{x:scale(phase.start_s),y,width:Math.max(.5,scale(phase.end_s)-scale(phase.start_s)-1),height:25,
          fill:i<3?'var(--viz-series-1)':'var(--viz-series-2)',
          opacity:active?(current?.9:.4):.10,
          'data-tooltip':`${phase.start_s.toFixed(2)}–${phase.end_s.toFixed(2)}秒｜${role.name}：${phase.rod_actions[role.id]}`});
      }
    }
    for(const event of plan.punch_events) {
      node('circle',{cx:scale(event.impact_candidate_s),cy:22,r:3.3,fill:'none',stroke:'var(--foreground)','stroke-width':1,
        'data-tooltip':`${event.impact_candidate_s.toFixed(2)}秒拳声候选（待试听确认）`});
    }
    const x=scale(time);
    node('line',{x1:x,y1:31,x2:x,y2:264,stroke:'var(--foreground)','stroke-width':1.5});
    clock.textContent=`${time.toFixed(2)} / 85.33 秒`;slider.value=String(time);picker.value=cue.id;
    detail.textContent=`${cue.name}：${cue.sequence}`;
  }
  function setTime(value) {
    const v=Number(value);time=Number.isFinite(v)?Math.max(0,Math.min(plan.duration_s,v)):0;draw();
  }
  function save() {
    if(window.openai&&typeof window.openai.setWidgetState==='function') {
      window.openai.setWidgetState({modelContent:{cue_id:selected().id,time_s:time},privateContent:{time_s:time}}).catch(()=>{});
    }
  }
  slider.addEventListener('input',()=>setTime(slider.value));
  slider.addEventListener('change',save);
  picker.addEventListener('change',()=>{setTime(plan.phases.find(c=>c.id===picker.value).start_s);save();});
  window.addEventListener('openai:set_globals',event=>{
    const state=event.detail?.globals?.widgetState;
    const saved=state?.privateContent?.time_s??state?.modelContent?.time_s;
    if(saved!==undefined)setTime(saved);
  });
  const initial=window.openai?.widgetState;
  setTime(initial?.privateContent?.time_s??initial?.modelContent?.time_s??0);
  new ResizeObserver(draw).observe(chart);
})();
</script>
